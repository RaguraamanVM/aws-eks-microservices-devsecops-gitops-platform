apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: devsecops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      nodeSelector:
        workload: platform
      containers:
        - name: product-service
          image: 634848780582.dkr.ecr.ap-south-1.amazonaws.com/devsecops/product-service:test
          imagePullPolicy: Always
          workingDir: /productapp
          command: ["python"]
          args: ["run.py"]
          ports:
            - containerPort: 5002
          env:
            - name: CONFIGURATION_SETUP
              value: "config.ProductionConfig"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cproduct-service
  namespace: devsecops
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 5002
      targetPort: 5002
