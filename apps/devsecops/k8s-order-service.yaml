apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: devsecops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        workload: platform

      containers:
        - name: order-service
          image: 634848780582.dkr.ecr.ap-south-1.amazonaws.com/devsecops/order-service:6da3be279437
          imagePullPolicy: Always
          workingDir: /orderapp
          command: ["python"]
          args: ["run.py"]

          ports:
            - containerPort: 5003

          env:
            - name: CONFIGURATION_SETUP
              value: "config.ProductionConfig"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: corder-service
  namespace: devsecops
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 5003
      targetPort: 5003
