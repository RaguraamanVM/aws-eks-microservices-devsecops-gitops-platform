apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: devsecops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      nodeSelector:
        workload: platform
      containers:
        - name: user-service
          image: 634848780582.dkr.ecr.ap-south-1.amazonaws.com/devsecops/user-service:6da3be279437
          imagePullPolicy: IfNotPresent
          workingDir: /userapp
          command: ["python"]
          args: ["run.py"]
          ports:
            - containerPort: 5001
          env:
            - name: CONFIGURATION_SETUP
              value: "config.ProductionConfig"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cuser-service
  namespace: devsecops
spec:
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
